name: Publish Web Preview

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/src/main/assets/www/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect web build
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/www/* _site/
          # На Pages манифест не нужен — приложение открывается как обычный сайт
          sed -i 's|<link rel="manifest"[^>]*>||' _site/index.html
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
