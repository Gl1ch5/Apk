name: Smoke Test (эмулятор)

# Отдельный workflow: проверяет, что APK действительно запускается и не падает.
# Запускается вручную и на каждый пуш в main (можно отключить, если не нужно).

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/build.gradle'
      - '.github/workflows/smoke.yml'

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -x lint

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in emulator and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh
