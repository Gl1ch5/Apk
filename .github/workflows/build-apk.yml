name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать GitHub Release с APK'
        type: boolean
        default: true

permissions:
  contents: write   # нужно для создания Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка «Газеты погоды»
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "✅ Найден keystore из секретов — собираем подписанный релиз."
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Секрет KEYSTORE_BASE64 не задан — APK будет подписан debug-ключом (устанавливается как обычно)."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease -x lint

      - name: Build debug APK (fallback)
        if: failure()
        run: |
          gradle --no-daemon :app:assembleDebug -x lint

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          found=0
          for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            [ -f "$f" ] || continue
            found=1
            cp "$f" "out/WeatherGazette-${GITHUB_SHA::7}-$(basename "$f")"
          done
          if [ "$found" = "0" ]; then echo "APK не найден"; exit 1; fi
          ls -lh out
          # Удобное стабильное имя для прямой ссылки
          first=$(ls out/*.apk | head -n1)
          cp "$first" out/WeatherGazette.apk
          ( cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WeatherGazette-APK-${{ github.sha }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: «Газета погоды» — сборка ${{ github.run_number }}
          body: |
            ## ГАЗЕТА ПОГОДЫ — свежий номер для Android

            Ежедневная сводка о погоде, свёрстанная как печатная газета.

            **Что внутри**
            - Передовица: текущая погода «журналистским» текстом
            - Прогноз по часам (24 ч) с графиками температуры и осадков
            - Неделя: минимумы/максимумы, вероятность дождя
            - Сводка: ветер, давление, влажность, УФ-индекс, восход/закат
            - Поиск по городам мира, геолокация, °C/°F
            - Три выпуска: дневной, вечерний, ночной
            - Офлайн-архив последнего полученного номера

            **Установка:** скачайте `WeatherGazette.apk` ниже и разрешите установку из этого источника.

            Данные: Open-Meteo (CC BY 4.0).
          files: out/*.apk
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
